[package]
name = "jpeg_meta_rs"
version = "0.1.0"
edition = "2024"
description = "CLI and library to extract common EXIF metadata (make, model, f-number, ISO, GPS) from JPEG files"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
keywords = ["exif", "jpeg", "metadata", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
kamadak-exif = "0.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comfy-table = "7"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
csv = "1"
